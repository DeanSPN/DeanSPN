<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="80" viewBox="0 0 1200 80">
  <defs>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b3261e" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#e8a33d"/>
      <stop offset="1" stop-color="#b3261e" stop-opacity="0"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 4s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 0.35; } 50% { opacity: 1; } }
    </style>
  </defs>
  <rect x="100" y="39" width="1000" height="2" fill="url(#line)" class="pulse"/>
  <text x="600" y="30" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="16" letter-spacing="4" fill="#c9b79c" class="pulse">Driver picks the music, shotgun shuts his cakehole.</text>
</svg>
