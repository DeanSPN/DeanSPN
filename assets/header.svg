<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050404"/>
      <stop offset="0.7" stop-color="#140a07"/>
      <stop offset="1" stop-color="#2a0e08"/>
    </linearGradient>
    <linearGradient id="fire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f6d58e"/>
      <stop offset="0.55" stop-color="#e8a33d"/>
      <stop offset="1" stop-color="#b3261e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b3261e" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#b3261e" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="6"/></filter>
    <style>
      .trap { transform-origin: 600px 150px; animation: spin 90s linear infinite; }
      .name { animation: flicker 6s infinite; }
      .tag { opacity: 0; animation: rise 1.6s 0.8s ease-out forwards; }
      .ember { animation: ember 7s linear infinite; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
      @keyframes flicker {
        0%, 18%, 22%, 60%, 64%, 66%, 100% { opacity: 1; }
        20%, 62%, 65% { opacity: 0.25; }
      }
      @keyframes ember {
        0% { transform: translateY(0); opacity: 0; }
        15% { opacity: 0.9; }
        100% { transform: translateY(-300px); opacity: 0; }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#sky)"/>
  <ellipse cx="600" cy="160" rx="420" ry="160" fill="url(#glow)"/>

  <g class="trap" fill="none" stroke="#b3261e" stroke-opacity="0.22" stroke-width="2">
    <circle cx="600" cy="150" r="140"/>
    <circle cx="600" cy="150" r="122"/>
    <circle cx="600" cy="150" r="104"/>
    <polygon points="600,46 661.1,234.1 501.1,117.9 698.9,117.9 538.9,234.1"/>
  </g>

  <g fill="#e8a33d">
    <circle class="ember" cx="180" cy="330" r="2" style="animation-delay:0s"/>
    <circle class="ember" cx="320" cy="330" r="1.5" style="animation-delay:2.1s"/>
    <circle class="ember" cx="470" cy="330" r="2.5" style="animation-delay:4.3s"/>
    <circle class="ember" cx="760" cy="330" r="1.5" style="animation-delay:1.2s"/>
    <circle class="ember" cx="880" cy="330" r="2" style="animation-delay:3.4s"/>
    <circle class="ember" cx="1040" cy="330" r="2.5" style="animation-delay:5.6s"/>
  </g>

  <g class="name" font-family="Georgia, 'Times New Roman', serif" font-weight="700" text-anchor="middle">
    <text x="600" y="172" font-size="96" letter-spacing="18" fill="#b3261e" filter="url(#blur)">DEAN</text>
    <text x="600" y="172" font-size="96" letter-spacing="18" fill="url(#fire)">DEAN</text>
  </g>

  <text class="tag" x="600" y="232" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="22" letter-spacing="3" fill="#c9b79c">Saving people. Hunting bugs. The family business.</text>
</svg>
